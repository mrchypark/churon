name: R CMD Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions: read-all

env:
  R_KEEP_PKG_SOURCE: yes
  ORT_VERSION: 1.29.0

jobs:
  rust:
    name: Rust ${{ matrix.toolchain.name }} (vendored, offline)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - {name: '1.88', version: '1.88.0'}
          - {name: stable, version: stable}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399
        with:
          r-version: release
          use-public-rspm: true

      - name: Install Rust
        run: rustup toolchain install ${{ matrix.toolchain.version }} --profile minimal --component rustfmt,clippy

      - name: Check committed Rust vendor
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain.version }}
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euo pipefail
          r_home=$(R RHOME)
          export LD_LIBRARY_PATH="$r_home/lib:${LD_LIBRARY_PATH:-}"
          test -f src/rust/vendor.tar.xz
          tar -tf src/rust/vendor.tar.xz >/dev/null
          tar -xf src/rust/vendor.tar.xz -C src
          mkdir -p src/.cargo
          cp src/rust/vendor-config.toml src/.cargo/config.toml
          cd src
          cargo fmt --check --manifest-path rust/Cargo.toml
          cargo clippy --offline --all-features --manifest-path rust/Cargo.toml -- -D warnings
          cargo test --offline --all-features --manifest-path rust/Cargo.toml

  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-15, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-24.04-arm, r: 'release'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup R
        uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Install ONNX Runtime
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}:${RUNNER_ARCH}" in
            Linux:X64) ORT_ARCHIVE="onnxruntime-linux-x64-${ORT_VERSION}.tgz"; ORT_SHA256="c3fddc4f139a045b0c4902c57410f0694f1c2fdf9b6939fbe38b1aeae7cd14ba"; ORT_LIBRARY=libonnxruntime.so ;;
            Linux:ARM64) ORT_ARCHIVE="onnxruntime-linux-aarch64-${ORT_VERSION}.tgz"; ORT_SHA256="e1799098ebc054b370f6176a450f158720f297818c613e5dc99b92e2ec82346f"; ORT_LIBRARY=libonnxruntime.so ;;
            macOS:ARM64) ORT_ARCHIVE="onnxruntime-osx-arm64-${ORT_VERSION}.tgz"; ORT_SHA256="d0706fc34f315d8c88639d0a8c81f2e09e815f282cabed3493c06a054352cf92"; ORT_LIBRARY=libonnxruntime.dylib ;;
            Windows:X64) ORT_ARCHIVE="onnxruntime-win-x64-${ORT_VERSION}.zip"; ORT_SHA256="c9b4b7086b529ad814f428c1bad028e20a25d7dc0699836775faace4ab5b78b2"; ORT_LIBRARY=onnxruntime.dll ;;
            *) echo "Unsupported runner: ${RUNNER_OS}:${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          cd inst/onnxruntime
          curl --fail --location --retry 3 --output "$ORT_ARCHIVE" "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/${ORT_ARCHIVE}"
          if command -v sha256sum >/dev/null; then
            printf '%s  %s\n' "$ORT_SHA256" "$ORT_ARCHIVE" | sha256sum -c -
          else
            printf '%s  %s\n' "$ORT_SHA256" "$ORT_ARCHIVE" | shasum -a 256 -c -
          fi
          if [[ "$ORT_ARCHIVE" == *.zip ]]; then unzip -q "$ORT_ARCHIVE"; else tar -xzf "$ORT_ARCHIVE"; fi
          extracted_dir=$(find . -maxdepth 1 -type d -name 'onnxruntime-*' -print -quit)
          test -n "$extracted_dir"
          cp -R "$extracted_dir"/. .
          rm -rf "$extracted_dir" "$ORT_ARCHIVE"
          ORT_PATH="$GITHUB_WORKSPACE/inst/onnxruntime/lib/$ORT_LIBRARY"
          test -f "$ORT_PATH"
          echo "ORT_DYLIB_PATH=$ORT_PATH" >> "$GITHUB_ENV"

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Check committed Rust vendor
        shell: bash
        run: tar -tf src/rust/vendor.tar.xz >/dev/null

      - uses: r-lib/actions/check-r-package@465b7d8e732ca3921382b1674c59bada9cbf3399
        with:
          error-on: '"warning"'

  R-CMD-check-no-ort:
    name: ubuntu-latest (no ORT, R ${{ matrix.r }}, offline)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        r: [devel, release, '4.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup R
        uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Install dependencies
        if: matrix.r != '4.0'
        uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install curl headers on R 4.0
        if: matrix.r == '4.0'
        run: sudo apt-get update && sudo apt-get install --yes libcurl4-openssl-dev

      - name: Install dependencies on R 4.0
        if: matrix.r == '4.0'
        shell: Rscript {0}
        run: |
          install.packages(c("digest", "rcmdcheck", "remotes"))
          # Last releases supporting R 4.0; current releases require R >= 4.1.
          remotes::install_version("glue", "1.8.0", upgrade = "never")
          remotes::install_version("diffobj", "0.3.6", upgrade = "never")
          remotes::install_version("fs", "1.6.6", upgrade = "never")
          remotes::install_version("testthat", "3.2.3", upgrade = "never")
          stopifnot(requireNamespace("testthat", quietly = TRUE), requireNamespace("waldo", quietly = TRUE))

      - name: Check package without ONNX Runtime
        env:
          CARGO_NET_OFFLINE: "true"
          RUSTUP_TOOLCHAIN: 1.88.0
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9
        uses: r-lib/actions/check-r-package@465b7d8e732ca3921382b1674c59bada9cbf3399
        with:
          error-on: '"warning"'
